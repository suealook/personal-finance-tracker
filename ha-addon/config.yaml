name: "Personal Finance Tracker"
version: "0.1.2"
slug: "personal_finance"
description: "Telegram-logged budget tracker with a local dashboard and Claude-powered insights"
url: "https://github.com/suealook/personal-finance-tracker"
arch:
  - aarch64
  - armv7
startup: services
boot: auto
ports:
  5000/tcp: 5000
ports_description:
  5000/tcp: "Web dashboard"
hassio_api: true
hassio_role: default
options:
  telegram_bot_token: ""
  telegram_allowed_user_id: ""
  google_sheet_id: ""
  google_service_account_json: ""
  anthropic_api_key: ""
  claude_model: "claude-sonnet-5"
schema:
  telegram_bot_token: "password"
  telegram_allowed_user_id: "str"
  google_sheet_id: "str"
  google_service_account_json: "str"
  anthropic_api_key: "password"
  claude_model: "str"
