{% extends "base.html" %}
{% block title %}Budgets{% endblock %}
{% block content %}
  <h1>Set planned budgets</h1>
  <form method="get" class="inline-form">
    <label>Month: <input type="month" name="month" value="{{ month }}" onchange="this.form.submit()"></label>
  </form>

  {% if categories %}
  <form method="post">
    <input type="hidden" name="month" value="{{ month }}">
    <div class="table-scroll">
    <table>
      <thead><tr><th>Category</th><th>Planned amount</th></tr></thead>
      <tbody>
        {% for c in categories %}
        <tr>
          <td>{{ c }}</td>
          <td><input type="number" step="0.01" name="amount_{{ c }}" value="{{ planned.get(c, '') }}"></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    </div>
    <button type="submit" style="margin-top: 1rem;">Save budgets for {{ month }}</button>
  </form>
  {% else %}
  <p>No active categories yet. <a href="{{ url_for('categories_page') }}">Add some first</a>.</p>
  {% endif %}
{% endblock %}
