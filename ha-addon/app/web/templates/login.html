<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Finance Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=asset_version) }}">
  <meta name="theme-color" content="#080b13">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
</head>
<body>
  <div class="login-wrap">
    <form class="card login-card" method="post" action="{{ url_for('login') }}">
      <h1 class="login-title">Finance Tracker</h1>
      <p class="muted login-subtitle">Sign in to continue</p>

      {% if error %}
      <p class="login-error">{{ error }}</p>
      {% endif %}

      <input type="hidden" name="next" value="{{ next }}">

      {% if username_required %}
      <label class="login-field">
        Username
        <input type="text" name="username" autocomplete="username" autofocus required>
      </label>
      {% endif %}

      <label class="login-field">
        Password
        <input type="password" name="password" autocomplete="current-password" required {{ 'autofocus' if not username_required }}>
      </label>

      <button type="submit">Sign in</button>

      <p class="muted login-forgot">
        Forgot your password? Reset it in Home Assistant:
        Settings &rarr; Add-ons &rarr; Personal Finance Tracker &rarr; Configuration.
      </p>
    </form>
  </div>
</body>
</html>
