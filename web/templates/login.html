<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Steve Personal Finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=asset_version) }}">
  <meta name="theme-color" content="#05070f">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
</head>
<body>
  <div class="login-wrap" id="login-wrap">
    <div class="bttf-stars" aria-hidden="true"></div>
    <div class="bttf-grid" aria-hidden="true"></div>
    <canvas id="warp-fx" aria-hidden="true"></canvas>
    <div class="warp-flash" aria-hidden="true"></div>

    <div class="bttf-hero">
      <div class="bttf-eyebrow">Welcome to</div>
      <div class="bttf-line1">Steve</div>
      <div class="bttf-line2">Personal Finance</div>
      <div class="bttf-trail" aria-label="site">
        <span style="--o: 1">S</span><span style="--o: 1">I</span><span style="--o: 1">T</span><span style="--o: 1">E</span><span style="--o: .75">E</span><span style="--o: .55">E</span><span style="--o: .35">E</span><span style="--o: .18">E</span>
      </div>
      <p class="bttf-tagline">Roads? Where we're going, we don't need roads.</p>
    </div>

    <form class="login-card" method="post" action="{{ url_for('auth_google_start') }}"
          onsubmit="this.querySelector('button[type=submit]').disabled = true;">
      <h1 class="login-title">Sign in to continue</h1>

      {% if error %}
      <p class="login-error">{{ error }}</p>
      {% endif %}

      <input type="hidden" name="next" value="{{ next }}">

      <label class="login-field" style="flex-direction: row; align-items: center; gap: 0.5rem;">
        <input type="checkbox" name="remember_me" style="width: auto;">
        Remember me for 3 days
      </label>

      <button type="submit" class="google-signin-btn">
        <svg class="google-signin-btn__logo" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
        </svg>
        <span>Sign in with Google</span>
      </button>
    </form>
  </div>

  <script>
  (function () {
    // Warp jump on sign-in: intercept the submit, play ~0.88s of star-streak
    // + flash, then continue the real POST to Google. Skipped entirely (form
    // submits immediately) under prefers-reduced-motion; with JS off the
    // listener never attaches and the form just submits natively.
    var form = document.querySelector('.login-card');
    var wrap = document.getElementById('login-wrap');
    var canvas = document.getElementById('warp-fx');
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var WARP_MS = 880; // it's a Back to the Future site — of course it's 88.
    var warping = false;

    function startStreaks() {
      var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      canvas.width = wrap.clientWidth * dpr;
      canvas.height = wrap.clientHeight * dpr;
      var ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      var w = wrap.clientWidth;
      var h = wrap.clientHeight;
      var cx = w / 2;
      var cy = h * 0.42; // radiate from the hero, not dead center
      var maxR = Math.hypot(w, h);

      var stars = [];
      for (var i = 0; i < 150; i++) {
        stars.push({
          angle: Math.random() * Math.PI * 2,
          dist: 0.04 + Math.random() * 0.5,
          hue: Math.random() < 0.18 ? '255, 190, 90' : (Math.random() < 0.5 ? '155, 226, 255' : '255, 255, 255'),
        });
      }

      var t0 = performance.now();
      (function frame(now) {
        var t = Math.min((now - t0) / WARP_MS, 1);
        var speed = t * t * 0.55; // accelerate — slow start, violent finish
        ctx.clearRect(0, 0, w, h);
        ctx.lineCap = 'round';
        for (var i = 0; i < stars.length; i++) {
          var s = stars[i];
          var r1 = s.dist * maxR * (0.15 + speed);
          var r2 = s.dist * maxR * (0.15 + speed * 1.6) + 2;
          ctx.strokeStyle = 'rgba(' + s.hue + ',' + Math.min(0.85, 0.15 + t) + ')';
          ctx.lineWidth = 1 + t * 1.6;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(s.angle) * r1, cy + Math.sin(s.angle) * r1);
          ctx.lineTo(cx + Math.cos(s.angle) * r2, cy + Math.sin(s.angle) * r2);
          ctx.stroke();
        }
        if (t < 1) requestAnimationFrame(frame);
      })(t0);
    }

    form.addEventListener('submit', function (e) {
      if (reduceMotion || warping) return; // let it submit normally
      e.preventDefault();
      warping = true;
      wrap.classList.add('warping');
      startStreaks();
      setTimeout(function () { form.submit(); }, WARP_MS);
    });
  })();
  </script>
</body>
</html>
