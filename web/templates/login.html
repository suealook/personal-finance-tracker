<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Finance Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=asset_version) }}">
  <meta name="theme-color" content="#080b13">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
</head>
<body>
  <div class="login-wrap">
    <form class="card login-card" method="post" action="{{ url_for('auth_google_start') }}"
          onsubmit="this.querySelector('button[type=submit]').disabled = true;">
      <h1 class="login-title">Finance Tracker</h1>
      <p class="muted login-subtitle">Sign in to continue</p>

      {% if error %}
      <p class="login-error">{{ error }}</p>
      {% endif %}

      <input type="hidden" name="next" value="{{ next }}">

      <label class="login-field" style="flex-direction: row; align-items: center; gap: 0.5rem;">
        <input type="checkbox" name="remember_me" style="width: auto;">
        Remember me for 3 days
      </label>

      <button type="submit" class="google-signin-btn">
        <svg class="google-signin-btn__logo" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
        </svg>
        <span>Sign in with Google</span>
      </button>
    </form>
  </div>
</body>
</html>
