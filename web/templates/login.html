<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Finance Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=asset_version) }}">
  <meta name="theme-color" content="#080b13">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
</head>
<body>
  <div class="login-wrap">
    <form class="card login-card" method="post" action="{{ url_for('auth_google_start') }}">
      <h1 class="login-title">Finance Tracker</h1>
      <p class="muted login-subtitle">Sign in to continue</p>

      {% if error %}
      <p class="login-error">{{ error }}</p>
      {% endif %}

      <input type="hidden" name="next" value="{{ next }}">

      <label class="login-field" style="flex-direction: row; align-items: center; gap: 0.5rem;">
        <input type="checkbox" name="remember_me" style="width: auto;">
        Remember me for 3 days
      </label>

      <button type="submit">Sign in with Google</button>
    </form>
  </div>
</body>
</html>
