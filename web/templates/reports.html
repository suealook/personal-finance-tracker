{% extends "base.html" %}
{% block title %}Reports{% endblock %}
{% block content %}
  <h1>Monthly reports</h1>

  <div class="card">
  <form method="post" action="{{ url_for('reports_generate') }}" class="inline-form">
    <label>Month: <input type="month" name="month" value="{{ current_month }}"></label>
    <button type="submit">Generate report</button>
  </form>
  </div>

  <div class="card">
  <ul>
    {% for r in reports %}
    <li><a href="{{ url_for('report_detail', month=r.Month) }}">{{ r.Month }}</a> — generated {{ r.GeneratedAt }}</li>
    {% else %}
    <li>No reports generated yet.</li>
    {% endfor %}
  </ul>
  </div>
{% endblock %}
